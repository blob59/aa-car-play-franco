<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AA Car Play Video - Franco</title>
  <style>
    :root{
      --card-bg: rgba(255,255,255,0.96);
      --text: #181827;
      --muted: #6e7280;
      --accent: #7b55d9;
      --glass: rgba(255,255,255,0.22);
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color:var(--text);
      background:#0c1630;
      overflow-x:hidden;
    }

    body{
      background:
        linear-gradient(rgba(6,13,33,.62), rgba(6,13,33,.72)),
        url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1800&q=80") center/cover fixed;
    }

    .app{
      min-height:100vh;
      padding:28px 5vw 34px;
    }

    header{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:96px;
      margin-bottom:20px;
    }

    .mic{
      position:absolute;
      left:0;
      top:28px;
      font-size:42px;
      opacity:.28;
      filter: grayscale(1);
    }

    .title-wrap{
      display:flex;
      align-items:center;
      gap:18px;
      text-align:center;
    }

    .logo{
      width:86px;
      height:86px;
      display:grid;
      place-items:center;
      font-size:56px;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,.25));
      animation: floaty 3s ease-in-out infinite;
    }

    @keyframes floaty{
      0%,100%{ transform: translateY(0) rotate(-2deg); }
      50%{ transform: translateY(-8px) rotate(2deg); }
    }

    h1{
      margin:0;
      font-size:clamp(30px, 4vw, 56px);
      letter-spacing:-1px;
      color:rgba(2,5,18,.72);
      font-weight:800;
      text-shadow:0 1px 0 rgba(255,255,255,.08);
    }

    .weather{
      position:absolute;
      right:0;
      top:18px;
      display:flex;
      align-items:center;
      gap:12px;
      padding:14px 24px;
      border-radius:999px;
      background:rgba(219,238,231,.72);
      backdrop-filter: blur(8px);
      font-size:24px;
      font-weight:700;
      box-shadow:0 8px 25px rgba(0,0,0,.12);
      white-space:nowrap;
    }

    .weather small{
      font-size:18px;
      color:#66736f;
      font-weight:500;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(3, minmax(180px,1fr));
      gap:28px;
      max-width:1500px;
      margin:0 auto;
    }

    .card{
      min-height:190px;
      border:0;
      border-radius:24px;
      background:var(--card-bg);
      box-shadow:0 18px 42px rgba(0,0,0,.26);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:18px;
      cursor:pointer;
      transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
      position:relative;
      overflow:hidden;
    }

    .card::before{
      content:"";
      position:absolute;
      top:-1px;
      left:10px;
      right:10px;
      height:7px;
      border-radius:0 0 999px 999px;
      background:rgba(255,255,255,.98);
      box-shadow:0 0 14px rgba(255,255,255,.9);
      opacity:.9;
    }

    .card:active{
      transform:scale(.97);
      box-shadow:0 8px 24px rgba(0,0,0,.28);
    }

    .icon{
      font-size:68px;
      line-height:1;
    }

    .label{
      font-size:clamp(24px, 2.4vw, 34px);
      font-weight:500;
      color:#202030;
      text-align:center;
    }

    .purple{ color:#835ad7; }
    .red{ color:#ff2222; }
    .blue{ color:#4aa8f5; }
    .green{ color:#46b36c; }
    .teal{ color:#25a69a; }
    .gray{ color:#7b8b94; }

    .panel{
      position:fixed;
      inset:0;
      z-index:10;
      background:rgba(5,9,21,.92);
      backdrop-filter: blur(10px);
      display:none;
      padding:22px;
    }

    .panel.open{ display:flex; flex-direction:column; }

    .panel-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:18px;
      margin-bottom:18px;
      color:white;
    }

    .panel-title{
      font-size:32px;
      font-weight:800;
    }

    .close{
      border:0;
      border-radius:18px;
      padding:14px 22px;
      font-size:22px;
      font-weight:700;
      background:white;
      color:#111;
      cursor:pointer;
    }

    .panel-body{
      flex:1;
      background:white;
      border-radius:24px;
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }

    iframe{
      width:100%;
      height:100%;
      border:0;
      flex:1;
      background:white;
    }

    .station-list{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:18px;
      padding:22px;
      overflow:auto;
      background:#f3f5fb;
    }

    .station{
      border:0;
      border-radius:22px;
      padding:22px;
      min-height:120px;
      background:white;
      box-shadow:0 8px 22px rgba(0,0,0,.09);
      font-size:24px;
      font-weight:700;
      cursor:pointer;
    }

    audio{
      width:100%;
      padding:16px 22px;
      background:white;
    }

    .notice{
      padding:22px;
      font-size:24px;
      line-height:1.45;
      color:#1f2430;
    }

    .notice a{
      display:inline-block;
      margin:10px 10px 0 0;
      padding:14px 18px;
      border-radius:16px;
      background:#111827;
      color:white;
      text-decoration:none;
      font-weight:700;
    }

    @media (max-width:900px){
      .app{ padding:18px 18px 28px; }
      header{ flex-direction:column; align-items:center; gap:12px; min-height:auto; }
      .mic,.weather{ position:static; }
      .title-wrap{ flex-direction:column; gap:4px; }
      .logo{ width:64px; height:64px; font-size:46px; }
      .grid{ grid-template-columns:1fr; gap:18px; }
      .card{ min-height:150px; }
      .icon{ font-size:54px; }
    }

    @media (orientation:landscape) and (max-height:650px){
      .app{ padding:16px 4vw 20px; }
      header{ min-height:72px; margin-bottom:10px; }
      .logo{ width:64px; height:64px; font-size:44px; }
      h1{ font-size:34px; }
      .weather{ top:8px; padding:10px 18px; font-size:22px; }
      .grid{ gap:18px; }
      .card{ min-height:145px; border-radius:22px; }
      .icon{ font-size:54px; }
      .label{ font-size:25px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="mic">🎙️</div>

      <div class="title-wrap">
        <div class="logo">🚙</div>
        <h1>AA Car Play Video</h1>
      </div>

      <div class="weather">
        🌥️ <span>15°C</span> <small>Olgiate Molgora</small>
      </div>
    </header>

    <section class="grid">
      <button class="card" onclick="openNotice('App')">
        <div class="icon purple">▦</div>
        <div class="label">App</div>
      </button>

      <button class="card" onclick="openFrame('YouTube Kids','https://www.youtubekids.com/')">
        <div class="icon red">▶️</div>
        <div class="label">YouTube Kids</div>
      </button>

      <button class="card" onclick="openFrame('YouTube Music','https://music.youtube.com/')">
        <div class="icon red">⏯️</div>
        <div class="label">YouTube Music</div>
      </button>

      <button class="card" onclick="openNotice('Podcast')">
        <div class="icon purple">🎙️</div>
        <div class="label">Podcast</div>
      </button>

      <button class="card" onclick="openNotice('Impostazioni')">
        <div class="icon gray">⚙️</div>
        <div class="label">Impostazioni</div>
      </button>

      <button class="card" onclick="openNotice('Mirroring Schermo')">
        <div class="icon blue">📺</div>
        <div class="label">Mirroring Schermo</div>
      </button>

      <button class="card" onclick="openRadio()">
        <div class="icon">📻</div>
        <div class="label">Radio</div>
      </button>

      <button class="card" onclick="openFrame('Musica','https://open.spotify.com/')">
        <div class="icon red">🎵</div>
        <div class="label">Musica</div>
      </button>

      <button class="card" onclick="openTachimetro()">
        <div class="icon red">🏎️</div>
        <div class="label">Tachimetro</div>
      </button>

      <button class="card" onclick="openFrame('YouTube','https://www.youtube.com/')">
        <div class="icon red">▶️</div>
        <div class="label">YouTube</div>
      </button>

      <button class="card" onclick="openBrowser()">
        <div class="icon teal">🌐</div>
        <div class="label">Browser web</div>
      </button>

      <button class="card" onclick="openNotice('TV')">
        <div class="icon green">📺</div>
        <div class="label">TV</div>
      </button>
    </section>
  </main>

  <section id="panel" class="panel">
    <div class="panel-head">
      <div id="panelTitle" class="panel-title">Titolo</div>
      <button class="close" onclick="closePanel()">Chiudi</button>
    </div>
    <div id="panelBody" class="panel-body"></div>
  </section>

  <script>
    const panel = document.getElementById("panel");
    const panelTitle = document.getElementById("panelTitle");
    const panelBody = document.getElementById("panelBody");

    function openPanel(title, html){
      panelTitle.textContent = title;
      panelBody.innerHTML = html;
      panel.classList.add("open");
    }

    function closePanel(){
      panel.classList.remove("open");
      panelBody.innerHTML = "";
    }

    function openFrame(title, url){
      openPanel(title, `<iframe src="${url}" allow="autoplay; fullscreen; picture-in-picture"></iframe>`);
    }

    function openNotice(title){
      let text = "";
      if(title === "Mirroring Schermo"){
        text = "Il mirroring vero non può funzionare da una pagina Cloudflare: serve un'app Android o il sistema Android dell'autoradio. Qui possiamo lasciare il pulsante come collegamento grafico.";
      } else if(title === "TV"){
        text = "Qui possiamo inserire una lista M3U o link diretti ai canali. Da browser alcuni flussi potrebbero non partire per blocchi dei siti.";
      } else if(title === "Impostazioni"){
        text = "Impostazioni demo: questa versione web serve per provare grafica e navigazione. La versione APK richiederebbe Android Studio.";
      } else {
        text = "Modulo demo pronto. Possiamo collegarlo a una pagina, a un player, a una radio o a un tuo servizio.";
      }

      openPanel(title, `
        <div class="notice">
          <strong>${title}</strong><br><br>
          ${text}<br><br>
          <a href="#" onclick="closePanel()">Torna alla home</a>
        </div>
      `);
    }

    function openRadio(){
      openPanel("Radio", `
        <audio id="radioPlayer" controls autoplay></audio>
        <div class="station-list">
          <button class="station" onclick="playRadio('Virgin Radio','http://icecast.unitedradio.it/Virgin.mp3')">Virgin Radio</button>
          <button class="station" onclick="playRadio('Radio 105','http://icecast.unitedradio.it/Radio105.mp3')">Radio 105</button>
          <button class="station" onclick="playRadio('Rai Radio 1','http://icestreaming.rai.it/1.mp3')">Rai Radio 1</button>
          <button class="station" onclick="playRadio('Rai Radio 3','http://icestreaming.rai.it/3.mp3')">Rai Radio 3</button>
          <button class="station" onclick="playRadio('Swiss Jazz','https://stream.srg-ssr.ch/m/rsj/mp3_128')">Swiss Jazz</button>
          <button class="station" onclick="playRadio('SomaFM Groove Salad','https://ice1.somafm.com/groovesalad-128-mp3')">SomaFM</button>
        </div>
      `);
    }

    function playRadio(name, url){
      panelTitle.textContent = "Radio - " + name;
      const audio = document.getElementById("radioPlayer");
      audio.src = url;
      audio.play().catch(() => {});
    }

    function openBrowser(){
      openPanel("Browser web", `
        <div class="notice">
          <strong>Browser web</strong><br><br>
          Scrivi un sito e premi Apri. Alcuni siti non permettono di essere mostrati dentro un riquadro.
          <form onsubmit="event.preventDefault(); openFrame('Browser web', document.getElementById('urlInput').value.startsWith('http') ? document.getElementById('urlInput').value : 'https://' + document.getElementById('urlInput').value)" style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;">
            <input id="urlInput" placeholder="es. francoficara.com" style="flex:1;min-width:240px;font-size:22px;padding:16px;border-radius:16px;border:1px solid #ccc;">
            <button style="font-size:22px;padding:16px 22px;border:0;border-radius:16px;background:#111827;color:white;font-weight:800;">Apri</button>
          </form>
          <a href="https://www.google.com" target="_blank">Google</a>
          <a href="https://www.italia.fm" target="_blank">Italia.FM</a>
          <a href="https://www.youtube.com" target="_blank">YouTube</a>
        </div>
      `);
    }

    function openTachimetro(){
      openPanel("Tachimetro", `
        <div class="notice" style="text-align:center;">
          <div style="font-size:120px;font-weight:900;line-height:1;">0</div>
          <div style="font-size:34px;font-weight:700;">km/h</div>
          <br>
          Versione demo web. Il tachimetro reale richiede GPS e permessi del telefono; dentro Android Auto spesso viene bloccato.
        </div>
      `);
    }
  </script>
</body>
</html>
